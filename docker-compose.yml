#
# docker-compose.yml — WhatsApp HTTP API (WAHA) for signal-tui-client
#
# Runs ONLY the lightweight WhatsApp HTTP API container (devlikeapro/waha),
# the official "WhatsApp HTTP API". The Python TUI runs natively on the host
# (it is a terminal UI), and talks to this service at
# http://127.0.0.1:${WHATSAPP_API_PORT:-3005} (default 3005).
#
# Start:
#   docker compose up -d
#
# The session and media files persist in ./whatsapp-data (git-ignored).
# Pair the device with:  python3 link_whatsapp.py
#

services:
  whatsapp:
    image: devlikeapro/waha:latest
    container_name: signal-tui-whatsapp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'      # Impedisce di usare tutta la CPU
          memory: 2048M    # Massimo 2GB di RAM per tutto il container

    ports:
      # External port defaults to 3005 (configurable via WHATSAPP_API_PORT);
      # WAHA itself listens on 3000 inside the container.
      - "127.0.0.1:${WHATSAPP_API_PORT:-3005}:3000/tcp"
    environment:
      # Node heap cap: l'immagine WAHA defaulta a --max-old-space-size=16384
      # (16GB di commit virtuale per un processo che usa ~116MB). Limitiamo a
      # 1GB per non gonfiare il commit di sistema senza impatti funzionali.
      NODE_OPTIONS: "--max-old-space-size=1024"
      # WAHA stores sessions and media under this data dir inside the container.
      WAHA_DATA_DIR: "/app/.sessions"
      # Keep WAHA media indefinitely so delayed webhook/history downloads work.
      WHATSAPP_FILES_LIFETIME: "0"
      # The default session name used by the Python backend/link tool.
      WAHA_DEFAULT_SESSION: "${WHATSAPP_SESSION_NAME:-default}"
      # Event-driven (webhook) delivery: WAHA pushes incoming events to the
      # Python client's /webhook endpoint instead of the client polling
      # GET /api/messages per chat (which was saturating the server CPU/RAM).
      # The client runs on the HOST, so WAHA reaches it via host.docker.internal
      # (the bridge gateway) on the client's webhook port (default 8088).
      WAHA_WEBHOOK_URL: "http://host.docker.internal:${CLIENT_WEBHOOK_PORT:-8088}/webhook"
      # Name legacy + attuale: le versioni recenti di WAHA leggono
      # WHATSAPP_HOOK_EVENTS; WAHA_WEBHOOK_EVENTS è mantenuto per retrocompatibilità.
      WAHA_WEBHOOK_EVENTS: "message,message.any,message.ack,message.ack.group,presence.update,message.reaction"
      WHATSAPP_HOOK_EVENTS: "message,message.any,message.ack,message.ack.group,presence.update,message.reaction"
    extra_hosts:
      # On Linux, the container cannot resolve host.docker.internal unless it is
      # explicitly mapped to the host gateway.  This is required for WAHA to
      # reach the Python client's /webhook endpoint (default port 8088) on the
      # host, so incoming message pushes are delivered in real time.
      - "host.docker.internal:host-gateway"
    env_file:
      # Credentials (WAHA_API_KEY, dashboard/swagger auth) persist here so they
      # are NOT regenerated on every container start.  See .env.example.
      - .env
    volumes:
      # Persist session auth + media across container restarts / updates.
      - ./whatsapp-data:/app/.sessions
    networks:
      - default

networks:
  default:
    driver: bridge
