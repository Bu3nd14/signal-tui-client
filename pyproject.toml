# =============================================================================
# pyproject.toml — Configurazione condivisa (test, coverage, lint)
# Signal TUI Client — Fase 1 del piano CI
#
# Unica fonte di verità usata sia in locale sia in CI (runner Ubuntu).
# I comandi di Makefile/CI restano "minimi": tutti i flag vivono qui.
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: test che lancia la TUI (lento, headless)",
    "live: test su filo reale contro i backend (richiede LIVE_TESTS=1)",
    "live-manual: test live che richiede intervento manuale sul device (richiede LIVE_MANUAL=1)",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    "profiling/*",
    "scripts/*",
    "bin/*",
    ".venv/*",
    ".venv-test/*",
    ".pytest_cache/*",
    ".ruff_cache/*",
    "whatsapp-data/*",
    "__pycache__/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 68
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["profiling", ".opencode"]

[tool.basedpyright]
typeCheckingMode = "off"
# Temporary reduced subset for progressive rollout. Extend in follow-ups to:
# protocols/config.py (60 errors), protocols/manager.py (39),
# protocols/signal.py (633), protocols/telegram.py (354),
# protocols/whatsapp.py (771), protocols/whatsapp_events.py (350),
# protocols/whatsapp_rest.py (158).
strict = ["protocols/base.py", "models.py"]
pythonVersion = "3.12"
exclude = [".venv", ".venv-test", "__pycache__"]

[tool.ruff.lint]

[tool.ruff.format]
