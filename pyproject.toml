# =============================================================================
# pyproject.toml — Configurazione condivisa (test, coverage, lint)
# Signal TUI Client — Fase 1 del piano CI
#
# Unica fonte di verità usata sia in locale sia in CI (runner Ubuntu).
# I comandi di Makefile/CI restano "minimi": tutti i flag vivono qui.
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Basetemp corta per non superare il limite macOS di 104 char sui socket Unix
# (`megachat-run/server.sock` dentro tmp_path). Essendo un path fisso, due
# sessioni pytest concorrenti si cancellano a vicenda la basetemp.
addopts = "-ra --tb=short --strict-markers --basetemp=/tmp/t -m \"not smoke\""
asyncio_mode = "auto"
markers = [
    "integration: test che lancia la TUI (lento, headless)",
    "live: test su filo reale contro i backend (richiede LIVE_TESTS=1)",
    "live-manual: test live che richiede intervento manuale sul device (richiede LIVE_MANUAL=1)",
    "allow_unserializable_events: the test publishes non-JSON payloads on an EventBus on purpose",
    "smoke: test di smoke della TUI headless (boot + exit), escluso dal run default",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    "profiling/*",
    "scripts/*",
    "bin/*",
    ".venv/*",
    ".venv-test/*",
    ".pytest_cache/*",
    ".ruff_cache/*",
    "whatsapp-data/*",
    "__pycache__/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 68
show_missing = true

# Floor Python dichiarato: 3.13 — scelta di policy (allineamento alla matrice CI
# 3.13/3.14/3.15 e ai target tooling sotto), non un requisito di linguaggio: il
# minimo tecnico reale del codice è 3.11 (`from datetime import UTC`). Enforced a
# runtime da install.sh `REQUIRED_PYTHON_MINOR` e launcher/install.py
# `REQUIRED_PYTHON`. Nessuna tabella `[project]`: il progetto non è un pacchetto installabile.

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["profiling", ".opencode"]
# Ruff 0.16 formatta anche i blocchi Python dentro il markdown: i documenti di
# design contengono snippet illustrativi (non codice eseguibile) e non devono
# essere riscritti dal formatter. Il codice di produzione resta coperto da
# ``ruff format``/``ruff check``.
extend-exclude = ["*.md"]

[tool.basedpyright]
typeCheckingMode = "off"
# Temporary reduced subset for progressive rollout. Extend in follow-ups to:
# protocols/config.py (60 errors), protocols/manager.py (39),
# protocols/signal.py (633), protocols/telegram.py (354),
# protocols/whatsapp.py (771), protocols/whatsapp_events.py (350),
# protocols/whatsapp_rest.py (158).
strict = ["protocols/base.py", "models.py"]
pythonVersion = "3.13"
exclude = [".venv", ".venv-test", "__pycache__"]

[tool.ruff.lint]

[tool.ruff.format]
