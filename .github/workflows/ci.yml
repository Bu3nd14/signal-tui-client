# =============================================================================
# CI — Signal TUI Client (Fase 5: LINT + TEST con coverage gate + upload Codecov)
#
# Trigger : push su `master` + `pull_request` (le feature branch NON triggerano).
# Matrice : Python 3.12 + 3.13 — runner ubuntu-latest.
#   · 3.12 (coverage) → `make coverage` (gate fail_under=68) + upload Codecov (OIDC)
#   · 3.13 (test)     → `make test` (verifica cross-versione, senza overhead coverage)
#
# Fonte di verità: `pyproject.toml` (flag pytest/coverage/ruff) e `Makefile`
# (comandi condivisi locale/CI — decisione C). Il workflow resta "minimo".
#
# Il job `lint` gira per primo (fail-fast, `needs: lint` sul job `test`).
# =============================================================================

name: CI

on:
  push:
    branches: [master]      # solo il trunk; push su feature branch = nessuna CI
  pull_request:             # ogni PR (aperta / pushata / riaperta) triggera la CI

# Privilegio minimo: `contents: read` basta per il checkout.
# L'upload Codecov (OIDC) richiede `id-token: write`, ma SOLO nel job `test`
# (concesso a livello di job, non di workflow) — vedi sotto.
permissions:
  contents: read

# Evita run duplicate sullo stesso ref: un nuovo push annulla la run precedente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"          # il lint non è sensibile alla versione
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installa le dipendenze dev
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: make lint

      - name: Format check (ruff format)
        run: make format-check

  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    # `id-token: write` serve SOLO a codecov-action con use_oidc: true.
    # Concesso a livello di JOB (non di workflow): il job `lint` non lo riceve.
    # Deve ri-dichiarare `contents: read` perché a livello job i permessi SOSTITUISCONO
    # quelli di workflow (non si sommano).
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            coverage: true     # gamba "canonica": gate coverage + upload Codecov
          - python-version: "3.13"
            coverage: false    # solo test: copre i bug cross-versione

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installa le dipendenze (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # Gamba coverage (3.12): `make coverage` = pytest --cov --cov-report=term-missing
      # --cov-report=xml. Applica il gate `fail_under = 68` (pyproject.toml) e genera
      # coverage.xml. Fallisce il job se la coverage scende sotto la baseline.
      - name: Test con coverage e gate (soglia 68%)
        if: matrix.coverage
        run: make coverage

      # Gamba solo-test (3.13): stessa suite, senza overhead di coverage.
      - name: Esegui la suite di test
        if: ${{ ! matrix.coverage }}
        run: make test

      # Upload del report su Codecov — NON bloccante (fail_ci_if_error: false).
      # Autenticazione OIDC (nessun token): richiede GitHub App installata + repo attivato.
      # `verbose: true` solo per il primo setup (debug auth); rimovibile a regime.
      - name: Upload coverage a Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true
          verbose: true
